name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rahasia123
          MYSQL_DATABASE: cinetix
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prahasia123"
          --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Validasi schema.sql dan seed.sql
        run: |
          mysql -h 127.0.0.1 -uroot -prahasia123 < data/schema.sql
          mysql -h 127.0.0.1 -uroot -prahasia123 cinetix < data/seed.sql
      - name: Unit test backend
        working-directory: backend
        run: chmod +x gradlew && ./gradlew test --no-daemon